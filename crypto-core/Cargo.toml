[package]
name = "gpg4web-core"
version = "0.1.0"
edition = "2021"
description = "OpenPGP + post-quantum vault crypto core for gpg4web, compiled to WebAssembly"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

# OpenPGP. `draft-pqc` enables the IETF draft post-quantum algorithms
# (ML-KEM, ML-DSA, SLH-DSA) for OpenPGP keys.
pgp = { version = "0.16", features = ["draft-pqc"] }
smallvec = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# Post-quantum vault
ml-kem = "0.2"
kem = "0.3.0-pre.0"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hkdf = "0.12"
zeroize = "1"
base64 = "0.22"

console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true

# wasm-opt (binaryen) is fetched from GitHub releases, which isn't always
# reachable in CI/sandboxed builds. We optimize for size via the Rust profile
# above and skip the extra wasm-opt pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
