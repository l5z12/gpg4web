name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build & test crypto core (Node target)
        run: |
          wasm-pack build crypto-core --target nodejs --release --out-dir /tmp/wasm-node
          GPG4WEB_WASM=/tmp/wasm-node/gpg4web_core.js bun crypto-core/test.mjs

      - name: Type-check & build front-end (prebuild compiles the WASM core)
        run: |
          cd web
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Test gpg CLI simulator (against the Node-target WASM core)
        run: |
          cd web
          GPG4WEB_WASM=/tmp/wasm-node/gpg4web_core.js bun test src/lib/gpgcli.test.ts
