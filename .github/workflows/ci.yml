name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack

      - name: Build & test crypto core (Node target)
        run: |
          wasm-pack build crypto-core --target nodejs --release --out-dir /tmp/wasm-node
          GPG4WEB_WASM=/tmp/wasm-node/gpg4web_core.js node crypto-core/test.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WASM for the web
        run: |
          cd web
          npm ci || npm install
          npm run wasm

      - name: Type-check & build front-end
        run: |
          cd web
          npm run build
